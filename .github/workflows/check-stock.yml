name: Check iPhone stock

# Backup checker. When the PC runner (local_runner.py) is live it publishes every
# couple of minutes with source "pc", and this job skips itself to avoid double alerts.
on:
  schedule:
    - cron: "2-59/5 * * * *"  # every 5 min, offset from :00 (GitHub delays busy slots)
  workflow_dispatch:         # lets you run it manually from the Actions tab
    inputs:
      force:
        description: "Check even if the PC runner is live (app's Refresh button)"
        type: boolean
        default: false

permissions:
  contents: write            # needed to publish status.json to the "status" branch

concurrency:
  group: check-stock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Load previous status and history
        run: |
          echo '{}' > prev_status.json
          echo '{"events": []}' > prev_history.json
          if git fetch --depth=1 origin status 2>/dev/null; then
            git show origin/status:status.json > prev_status.json 2>/dev/null || echo '{}' > prev_status.json
            git show origin/status:history.json > prev_history.json 2>/dev/null || echo '{"events": []}' > prev_history.json
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Apple pickup availability
        env:
          APPLE_ZIP: ${{ secrets.APPLE_ZIP }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: >
          python checker/check_stock.py --config config.json --source github
          --defer-to-pc ${{ github.event.inputs.force == 'true' && '0' || '300' }}
          --prev prev_status.json --out status.json
          --history-in prev_history.json --history-out history.json

      - name: Publish status to the status branch
        if: hashFiles('status.json') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p publish && cp status.json history.json publish/
          cd publish
          git init -q -b status
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add status.json history.json
          git commit -qm "status $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" status
