name: Send test alert

# Sends a DRILL restock alert through the real alert code, using the NTFY_TOPIC secret.
# Run it from the Actions tab, or from the app's "Send test push" button (with a token).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/test-alert.yml"]   # also fires once when this file changes

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Send drill restock alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: python3 checker/check_stock.py --config config.json --drill
